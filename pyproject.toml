[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vram-switcher"
version = "2.0.0"
description = "Configurable local-GPU task coordinator for AstrBot"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["psutil>=5.9"]

[tool.setuptools.packages.find]
include = ["vram_switcher*"]
